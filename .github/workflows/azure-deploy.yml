# Make the folders
New-Item -ItemType Directory -Path ".github\workflows" -Force | Out-Null

# Create the file with the workflow contents
$workflow = @"
name: Build and Deploy Spring Boot to AKS

on:
  push:
    branches:
      - main

env:
  REGISTRY_NAME: ${{ secrets.ACR_NAME }}
  CLUSTER_NAME: ${{ secrets.AKS_NAME }}
  CLUSTER_RG:   ${{ secrets.AKS_RG }}
  IMAGE_NAME: recreation360-springboot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Docker image (ACR)
        run: az acr build --registry $ENV:REGISTRY_NAME --image $ENV:IMAGE_NAME:latest .

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group $ENV:CLUSTER_RG --name $ENV:CLUSTER_NAME --overwrite-existing

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
"@

Set-Content -Path ".github\workflows\azure-deploy.yml" -Value $workflow -NoNewline

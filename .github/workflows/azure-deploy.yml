name: Build and Deploy Spring Boot to AKS

on:
  push:
    branches:
      - main

env:
  REGISTRY_NAME: recreation360acr
  CLUSTER_NAME: recreation360aks
  CLUSTER_RG: recreation360rg
  IMAGE_NAME: recreation360springboot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure CLI login
        run: az account show

      - name: Build Docker image
        run: docker build -t $REGISTRY_NAME.azurecr.io/$IMAGE_NAME:latest .

      - name: Log in to ACR
        run: az acr login --name $REGISTRY_NAME

      - name: Push Docker image
        run: docker push $REGISTRY_NAME.azurecr.io/$IMAGE_NAME:latest

      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group $CLUSTER_RG --name $CLUSTER_NAME --overwrite-existing

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
